# Tests del servicio de OMR. Va aparte del resto: es Python, cambia poco y no
# tiene nada que ver con el despliegue de la web (el servicio vive en Cloud Run
# y se despliega a mano con scripts/deploy.sh).
name: OMR

on:
  push:
    paths: ["omr-service/**", ".github/workflows/omr.yml"]
  pull_request:
    paths: ["omr-service/**", ".github/workflows/omr.yml"]

concurrency:
  group: omr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: omr-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: omr-service/requirements-dev.txt
      # Se instala todo, no solo lo que tocan los tests: así se comprueba
      # también que las versiones fijadas siguen resolviendo en Python 3.11,
      # que es la del contenedor.
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
