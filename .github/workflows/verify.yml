# Lint, tipos, tests y build en cada PR y en cada push fuera de main.
# En main lo ejecuta deploy.yml con la misma composite action.
name: Verify

on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opus
          POSTGRES_PASSWORD: opus
          POSTGRES_DB: opus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opus -d opus_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://opus:opus@localhost:5432/opus_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/verify
