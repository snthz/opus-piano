# Pruebas y verificación de build. Se ejecuta en cada PR y push, y también
# como primer paso de deploy.yml (workflow_call).
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: etude
          POSTGRES_PASSWORD: etude
          POSTGRES_DB: etude_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U etude -d etude_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://etude:etude@localhost:5432/etude_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Cliente de Prisma
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: Tipos
        run: bun run typecheck

      - name: Tests unitarios
        run: bun run test

      - name: Migraciones en la base de datos de pruebas
        run: bunx prisma migrate deploy

      - name: Tests de integración (auth + progreso contra Postgres)
        run: bun run test:integration

      - name: Caché de Next.js
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'public/**', 'next.config.ts') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Build de Next.js
        run: bun run build
