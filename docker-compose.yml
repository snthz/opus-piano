# Opus Piano en Dokploy: tres servicios en la misma red interna.
# Solo `web` recibe tráfico de fuera (Dokploy le asigna el dominio en su interfaz).
services:
  web:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://etude:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}@db:5432/etude
      OMR_URL: http://omr:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      omr:
        condition: service_started

  omr:
    build: ./omr
    restart: unless-stopped
    environment:
      OMR_MAX_PAGES: "10"
      # Ventanas por lote en la inferencia: menos lote, menos RAM (y algo más lento).
      OMR_BATCH: "${OMR_BATCH:-4}"
    # oemer carga modelos grandes: con 3 GB el proceso muere (OOM) a mitad de página.
    # Reserva al menos 6 GB o ajusta OMR_MEMORY al VPS; si no hay tanta RAM, baja OMR_DPI a 150.
    deploy:
      resources:
        limits:
          memory: ${OMR_MEMORY:-6g}

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: etude
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      POSTGRES_DB: etude
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etude -d etude"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
