# Solo para desarrollo local: construye la imagen aquí (en vez de bajarla de ghcr.io),
# publica los puertos (en el VPS eso lo hace Traefik) y crea dokploy-network en vez
# de esperar la que ya existe en el servidor.
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d db
#      docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build web   # probar la imagen final
# Los puertos son variables (WEB_PORT / DB_PORT en .env) porque en local es
# habitual tener ya algo escuchando en 3000 o en 5432.
services:
  web:
    build:
      context: .
      # El dominio se incrusta al compilar; en local apunta a la máquina, no a producción.
      args:
        SITE_URL: ${SITE_URL:-http://localhost:3000}
    pull_policy: build
    ports:
      - "${WEB_PORT:-3000}:3000"
  db:
    ports:
      - "${DB_PORT:-5432}:5432"

  # Servicio de reconocimiento de partituras, solo para probarlo en local: en
  # producción vive en Cloud Run (ver omr-service/README.md) porque necesita
  # 2 GB y la CPU entera durante minutos, y el VPS no da para eso.
  # Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build omr
  omr:
    build:
      context: ./omr-service
    pull_policy: build
    restart: unless-stopped
    environment:
      PORT: 8000
      # Sin token en local; en Cloud Run es obligatorio.
      OMR_TOKEN: ${OMR_TOKEN:-}
      OMR_THREADS: ${OMR_THREADS:-0}
    ports:
      - "${OMR_PORT:-8000}:8000"
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: ${OMR_MEMORY:-5g}

networks:
  dokploy-network:
    external: false
